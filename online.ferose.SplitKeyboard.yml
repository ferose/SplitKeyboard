id: online.ferose.SplitKeyboard
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: splitkeyboard

finish-args:
  - --share=ipc
  # X11-only app (XTest/XGrabKey input + mask; launcher forces -platform xcb). On a Wayland
  # session it runs through xwayland via fallback-x11. --device=dri is standard GPU-render
  # access (without it Mesa fails to init and spams the log on every launch).
  - --socket=fallback-x11
  - --device=dri
  # No host filesystem grant: config lives in the app's own redirected XDG config dir.
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - "/lib/*.la"
  - "/lib/*.a"

modules:
  - name: splitkeyboard
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      # Our own source (originally forked from CoreKeyboard commit 454e241), built straight
      # from the splitkeyboard/ subdir of this repo -- that dir is the CMake project root, so
      # no `subdir:` is needed. The app id, binary, and metadata are correct in-source.
      - type: dir
        path: splitkeyboard
